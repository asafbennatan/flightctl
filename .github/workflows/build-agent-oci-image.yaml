name: "Build Agent OCI Image"

# Builds a package-mode (non-bootc) agent OCI image and uploads the bundle.
# Intentionally separate from build-agent-images.yaml, which is the bootc
# variants + qcow2 pipeline.

on:
  workflow_call:
    inputs:
      rpm_suffix:
        description: "RPM artifact suffix (root, e.g., centos-stream+epel-next-9-x86_64)"
        required: true
        type: string
      os_id:
        description: "Agent image OS ID (e.g., cs9-regular)"
        required: true
        type: string
      tag:
        description: "Image tag"
        required: true
        type: string

jobs:
  build-agent-oci-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Download RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: rpms-${{ inputs.rpm_suffix }}
          path: bin/rpm

      - name: Build agent OCI image
        env:
          TAG: ${{ inputs.tag }}
          AGENT_IMAGE_OUTPUT: bundle
          AGENT_OS_ID: ${{ inputs.os_id }}
        run: |
          mkdir -p bin/rpm
          ls bin/rpm/flightctl-agent-*.rpm >/dev/null 2>&1
          ls bin/rpm/flightctl-selinux-*.rpm >/dev/null 2>&1
          touch bin/.rpm
          ls -la bin/rpm
          make e2e-agent-images

      - name: Upload agent images bundle
        uses: actions/upload-artifact@v4
        with:
          name: agent-images-bundle-${{ inputs.os_id }}-${{ inputs.tag }}
          path: bin/agent-artifacts/agent-images-bundle-${{ inputs.os_id }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
